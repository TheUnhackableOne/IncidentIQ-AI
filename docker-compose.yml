version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incidentiq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incidentiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incidentiq-network

  redis:
    image: redis:7-alpine
    container_name: incidentiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incidentiq-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidentiq-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/incidentiq
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - APP_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - incidentiq-network
    command: |
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incidentiq-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - incidentiq-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  incidentiq-network:
    driver: bridge
